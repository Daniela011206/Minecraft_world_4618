      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lint tools
        run: |
          npm install --no-save htmlhint stylelint stylelint-config-standard postcss-html

      - name: Lint HTML
        run: npx htmlhint index.html

      - name: Lint CSS
        run: npx stylelint index.html
